name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: bun ci
      - run: bun run build

      - uses: actions/setup-node@v7
        with: { node-version: 24, package-manager-cache: false, registry-url: https://registry.npmjs.org }

      - run: npm publish
