name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - run: bun ci
      - run: bun run build
      - run: bun publish
